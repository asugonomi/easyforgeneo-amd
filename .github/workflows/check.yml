name: Offline safety checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: PowerShell 5.1 checks
        shell: powershell
        run: ./tests/Test-Safety.ps1
      - name: Python device selection checks
        run: python -m unittest discover -s tests -v
